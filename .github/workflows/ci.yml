# Проверка на каждый push и pull request: фронтенд, Rust-тесты, сервер скинов
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build
      - run: npx oxlint src server/skins server/relay

      - name: Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Сервер скинов
        run: |
          node --experimental-strip-types server/skins/test/worker.test.mjs
          node --experimental-strip-types server/skins/test/hub.test.mjs
          node --experimental-strip-types server/skins/test/tunnel.test.mjs
          node --experimental-strip-types server/skins/test/yggdrasil.test.mjs
          node --experimental-strip-types server/relay/test/relay.test.mjs
