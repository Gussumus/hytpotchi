[package]
name = "hytpotchi"
version = "0.4.2"
description = "Hytpotchi Minecraft Launcher"
authors = ["Hytpotchi Team"]
license = "GPL-3.0-only"
repository = "https://github.com/hytpotchi/launcher"
edition = "2024"
rust-version = "1.100"

[lib]
name = "hytpotchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.12", features = ["tray-icon", "image-ico", "image-png", "protocol-asset"] }
tauri-plugin-log = "2.9"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2.3"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "json", "stream", "charset", "system-proxy", "multipart"] }
url = "2"
urlencoding = "2"

# Crypto
aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
minisign-verify = "0.2"
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.2", features = ["std"] }
hex = "0.4"
base64 = "0.21"

# Windows
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# FS & archives
directories = "5"
walkdir = "2"
zip = "0.6"
tar = "0.4"
flate2 = "1"
zstd = "0.13"

# System
sysinfo = "0.33"

# Logging / errors
log = "0.4"
tracing = "0.1"
anyhow = "1"
thiserror = "2"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
semver = "1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
